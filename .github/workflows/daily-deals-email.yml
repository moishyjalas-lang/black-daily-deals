# Rebuilds the daily Top 10 email (v2/email/today.html) and RSS feed (v2/feed.xml)
# every morning at 6 AM New York time, so an RSS-to-email service can send it.
name: Daily deals email
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 6 AM New York (winter)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v2/scripts/build_daily.js
      - name: Save today's email
        run: |
          git config user.name "Black Daily Deals bot"
          git config user.email "actions@users.noreply.github.com"
          git add v2/email/today.html v2/feed.xml
          git diff --cached --quiet || git commit -m "Daily deals email for $(date -u +%F)"
          git push
