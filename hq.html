<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner HQ — Everyday Black Friday</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo-ebf-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/shared.js" defer></script>
<style>
:root{
  --page:#100d09;--panel:#201a13;--raised:#2a2218;--card:#1a1611;
  --text:#f5ebdd;--muted:#c3b5a0;--gold:#e4b565;--gold2:#f4d18b;--gold-deep:#c78b36;
  --border:#79603a;--border-soft:#4a3c26;--ink:#17120b;--red:#e0603a;--green:#9bc9a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',Arial,sans-serif;color:var(--text);background:var(--page);min-height:100vh;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}
button{font-family:inherit;cursor:pointer;}

/* ===== GATE (sign-in / access-denied) ===== */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(138,82,27,.28),transparent 60%),var(--page);}
.gate-box{max-width:420px;width:100%;text-align:center;background:linear-gradient(150deg,#241c13,#171412 70%);
  border:1px solid var(--border);border-radius:18px;padding:40px 34px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.gate-box img{height:48px;margin-bottom:18px;filter:drop-shadow(0 0 12px rgba(237,170,64,.4));}
.gate-box h1{font-size:26px;color:var(--text);margin-bottom:10px;}
.gate-box p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:24px;}
.gate-btn{background:linear-gradient(110deg,#c78b36,#f7d891 48%,#d39a42);color:var(--ink);border:none;
  padding:13px 26px;border-radius:999px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:10px;}
.gate-note{margin-top:18px;font-size:13px;color:#8a8070;}

/* ===== APP SHELL ===== */
.hq{display:none;min-height:100vh;}
.hq.show{display:block;}
.topbar{position:sticky;top:0;z-index:50;height:66px;display:flex;align-items:center;gap:18px;padding:0 24px;
  background:linear-gradient(180deg,rgba(32,26,19,.97),rgba(20,17,13,.97));backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);box-shadow:0 6px 30px rgba(0,0,0,.5);}
.tb-logo{display:flex;align-items:center;gap:11px;padding-right:20px;border-right:1px solid var(--border-soft);}
.tb-logo img{height:34px;filter:drop-shadow(0 0 9px rgba(237,170,64,.35));}
.tb-logo .wm1{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--text);}
.tb-logo .wm2{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--gold2);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.tb-link{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}
.tb-link:hover{color:var(--text);}
.tb-user{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--text);
  padding:6px 12px;border:1px solid var(--border-soft);border-radius:999px;}
.tb-user img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);}
.tb-burger{display:none;background:none;border:1px solid var(--border-soft);border-radius:8px;color:var(--gold2);padding:8px 10px;}

.layout{display:flex;align-items:flex-start;}
/* sidebar */
.sidebar{width:248px;flex-shrink:0;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;
  background:linear-gradient(180deg,#19140e,#120f0b);border-right:1px solid var(--border-soft);padding:16px 12px 40px;}
.nav-group{margin-top:16px;}
.nav-group:first-child{margin-top:4px;}
.nav-group-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a7a5f;padding:6px 12px 8px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#d8cdbb;font-size:14px;font-weight:500;
  transition:background .15s,color .15s;margin-bottom:2px;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;color:#a98f63;}
.nav-item:hover{background:rgba(228,181,101,.08);color:var(--text);}
.nav-item.active{background:linear-gradient(100deg,rgba(199,139,54,.22),rgba(228,181,101,.1));color:var(--gold2);
  box-shadow:inset 0 0 0 1px rgba(228,181,101,.25);}
.nav-item.active svg{color:var(--gold2);}

/* main */
.main{flex:1;min-width:0;padding:30px 34px 60px;}
.page-head{margin-bottom:24px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:clamp(28px,3.4vw,40px);font-weight:600;color:var(--text);}
.page-head .hl{color:var(--gold2);}
.page-head .sub{color:var(--muted);font-size:15px;margin-top:6px;}
.page-head .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:999px;padding:9px 16px;font-size:13px;color:var(--muted);}

/* metric cards */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px;}
.metric{background:linear-gradient(155deg,#241c13,#181410);border:1px solid var(--border-soft);border-radius:14px;
  padding:18px 16px;text-align:center;box-shadow:inset 0 1px rgba(255,255,255,.04);}
.metric .mi{color:var(--gold2);margin-bottom:10px;display:flex;justify-content:center;}
.metric .ml{font-size:13px;color:var(--muted);margin-bottom:8px;}
.metric .mv{font-size:24px;font-weight:800;color:var(--text);font-family:'DM Sans',sans-serif;}
.metric .mv.na{color:#6a5e49;}

.note-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:12px;padding:14px 18px;margin-bottom:22px;}
.tag-warn{background:rgba(228,181,101,.16);color:var(--gold2);border:1px solid rgba(228,181,101,.4);
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;}
.conv{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;flex-wrap:wrap;}
.conv .step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-soft);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--text);}

.section-title{font-size:18px;font-weight:600;color:var(--text);margin:8px 0 14px;}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.shortcut{display:flex;align-items:center;gap:11px;justify-content:center;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:12px;padding:15px;font-size:14px;font-weight:600;color:var(--text);transition:border-color .15s,background .15s;}
.shortcut svg{width:18px;height:18px;color:var(--gold2);}
.shortcut:hover{border-color:var(--gold);background:var(--raised);}

.panel-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.panel{background:linear-gradient(150deg,#1d1810,#161310);border:1px solid var(--border-soft);border-radius:14px;padding:20px;}
.panel h3{font-size:16px;color:var(--text);display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.panel h3 svg{width:17px;height:17px;color:var(--gold2);}
.empty-state{text-align:center;padding:22px 10px;}
.empty-state .lnk{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#3a2d1a,#241c12);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--gold2);border:1px solid var(--border-soft);}
.empty-state p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px;}
.inline-note{display:flex;align-items:center;gap:10px;background:#171310;border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:14px;}
.inline-note svg{width:16px;height:16px;color:#8a7a5f;flex-shrink:0;}
.panel.warn{border-color:rgba(224,96,58,.4);}
.panel.warn h3 svg{color:var(--red);}
.panel.warn .inline-note{border-color:rgba(224,96,58,.3);color:#e0b0a0;}
.panel.warn .inline-note svg{color:var(--red);}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);color:var(--gold2);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;}
.btn-ghost:hover{background:var(--raised);border-color:var(--gold);}
.btn-gold{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(110deg,#c78b36,#f7d891 48%,#d39a42);
  color:var(--ink);border:none;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 3px 14px rgba(186,118,40,.25);}
.btn-gold:hover{filter:brightness(1.06);}

/* tables */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.search-box{flex:1;min-width:220px;max-width:420px;position:relative;display:flex;align-items:center;}
.search-box svg{position:absolute;left:13px;color:var(--gold2);opacity:.8;width:16px;height:16px;}
.search-box input{width:100%;background:#16130f;border:1px solid var(--border-soft);color:var(--text);border-radius:999px;padding:10px 14px 10px 38px;font-size:14px;outline:none;}
.search-box input:focus{border-color:var(--gold2);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab{padding:8px 15px;border-radius:999px;border:1px solid var(--border-soft);background:#17130d;color:#d8cdbb;font-size:13px;font-weight:600;}
.tab.active{background:rgba(228,181,101,.14);border-color:var(--gold2);color:var(--gold2);}
.data-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;}
.data-table th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#8a7a5f;padding:13px 16px;border-bottom:1px solid var(--border-soft);font-weight:700;}
.data-table td{padding:13px 16px;border-bottom:1px solid rgba(74,60,38,.5);font-size:14px;color:var(--text);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(228,181,101,.04);}
.t-img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#16130f;border:1px solid var(--border-soft);}
.t-title{font-weight:600;max-width:260px;}
.t-sub{font-size:12px;color:var(--muted);}
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.status.live{background:rgba(155,201,160,.14);color:var(--green);border:1px solid rgba(155,201,160,.3);}
.status.draft{background:rgba(195,181,160,.12);color:var(--muted);border:1px solid var(--border-soft);}
.status.paused{background:rgba(224,96,58,.12);color:var(--red);border:1px solid rgba(224,96,58,.3);}
.row-edit{background:none;border:1px solid var(--border-soft);color:var(--gold2);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;}
.row-edit:hover{border-color:var(--gold);background:var(--raised);}

/* forms */
.form-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start;}
.form-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:24px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;background:#16130f;border:1px solid var(--border-soft);color:var(--text);
  border-radius:9px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold2);}
.field textarea{min-height:84px;resize:vertical;}
.field .hint{font-size:12px;color:#8a7a5f;margin-top:6px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.checks{display:flex;flex-wrap:wrap;gap:14px;}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);}
.preview-card{position:sticky;top:90px;}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

/* placeholder screens */
.ph{background:linear-gradient(150deg,#1d1810,#161310);border:1px dashed var(--border);border-radius:14px;padding:32px;}
.ph h3{font-size:20px;color:var(--text);margin-bottom:8px;}
.ph .queued{display:inline-block;background:rgba(228,181,101,.14);color:var(--gold2);border:1px solid rgba(228,181,101,.3);padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:16px;}
.ph ul{margin:12px 0 0 18px;color:var(--muted);font-size:14px;line-height:1.9;}
.ph .route{font-size:12px;color:#8a7a5f;margin-top:14px;font-family:monospace;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:#201a12;color:var(--text);
  padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:999;border:1px solid var(--gold-deep);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr);}.shortcuts{grid-template-columns:repeat(2,1fr);}.panel-row,.form-grid{grid-template-columns:1fr;}.preview-card{position:static;}}
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:66px;z-index:40;transform:translateX(-105%);transition:transform .22s;box-shadow:12px 0 40px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .tb-burger{display:block;}
  .main{padding:22px 16px 50px;}
  .metrics{grid-template-columns:repeat(2,1fr);}
  .tb-link span{display:none;}
}
</style>
</head>
<body>

<!-- ===== GATE: shown until we confirm an owner (admin) is signed in ===== -->
<div class="gate" id="gate">
  <div class="gate-box" id="gateBox">
    <img src="assets/logo-ebf.png" alt="Everyday Black Friday">
    <h1 id="gateTitle">Checking your access…</h1>
    <p id="gateMsg">One moment while we confirm you're signed in.</p>
    <div id="gateAction"></div>
    <div class="gate-note">This is the private Owner HQ. Only the site owner can enter.</div>
  </div>
</div>

<!-- ===== APP SHELL (revealed only for the owner) ===== -->
<div class="hq" id="hq">
  <div class="topbar">
    <button class="tb-burger" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu">☰</button>
    <a class="tb-logo" href="index.html" title="Back to public site">
      <img src="assets/logo-ebf.png" alt="EBF">
      <span><span class="wm1">Everyday Black Friday</span><br><span class="wm2">Owner Headquarters</span></span>
    </a>
    <div class="tb-right">
      <a class="tb-link" href="index.html" target="_blank"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span>View site</span></a>
      <div class="tb-user" id="tbUser"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="tbUserName">Owner</span></div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"><!-- nav injected by JS --></aside>
    <main class="main" id="view"><!-- route content injected by JS --></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Everyday Black Friday — Owner HQ shell
   Gated to the owner (Supabase is_admin). One shared shell,
   hash-routed screens. Deals read/write the live Supabase table.
   Screens not yet built show an honest "in build queue" panel,
   never a fake control.
   ============================================================ */

/* ---- The 16 destinations, grouped (per the handoff) ---- */
const NAV = [
  { group:'Overview', items:[
    ['','Dashboard','<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'],
  ]},
  { group:'Deals & Catalog', items:[
    ['deals','Deal Library','<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>'],
    ['deals/new','Add / Edit Deal','<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'],
    ['imports','Imports & Review','<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'],
    ['categories','Category Tree','<path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M14 14h7v7h-7z"/><path d="M3 14h7v7H3z"/>'],
  ]},
  { group:'Website & Marketing', items:[
    ['appearance','Site Appearance','<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'],
    ['promotions','Announcements & Pop-ups','<path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'],
    ['email','Newsletter & Email','<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>'],
  ]},
  { group:'People', items:[
    ['audience','Subscribers & Demand','<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>'],
    ['billing','Members & Billing','<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>'],
    ['support','Support & Reports','<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
    ['team','Team, Roles & Security','<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'],
  ]},
  { group:'Operations', items:[
    ['ai','AI Assistant & Releases','<path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>'],
    ['integrations','Integrations & Sources','<path d="M10.59 13.41a2 2 0 0 0 2.83 0l3.59-3.59a2 2 0 1 0-2.83-2.83l-1 1"/><path d="M13.41 10.59a2 2 0 0 0-2.83 0L7 14.17a2 2 0 1 0 2.83 2.83l1-1"/>'],
    ['health','Health, Activity & Recovery','<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'],
    ['emergency','Emergency Center','<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'],
  ]},
];

/* screens that are fully built vs. queued (honest placeholders) */
const BUILT = new Set(['', 'deals', 'deals/new', 'categories', 'imports', 'appearance', 'promotions', 'email', 'audience', 'billing', 'support', 'team', 'integrations', 'health', 'emergency', 'ai']);

function icon(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+p+'</svg>'; }

function renderNav(active){
  const el = document.getElementById('sidebar');
  el.innerHTML = NAV.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${g.group}</div>
      ${g.items.map(([route,label,path]) => `
        <a class="nav-item${route===active?' active':''}" href="#/${route}">${icon(path)}<span>${label}</span></a>
      `).join('')}
    </div>`).join('');
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return (n==null||isNaN(n))?'—':'$'+Number(n).toFixed(2); }
function fdate(s){ return s?String(s).slice(0,10):'—'; }

/* ---- authed REST helpers (owner access token; Supabase RLS enforces admin) ---- */
function sbURL(){ return (window.EBF_SUPABASE||{}).url||''; }
function sbKEY(){ return (window.EBF_SUPABASE||{}).publishableKey||''; }
function sbHeaders(extra){ const s=EBF.getSession()||{}; return Object.assign({ apikey:sbKEY(), Authorization:'Bearer '+(s.access_token||'') }, extra||{}); }
async function sbSelect(path){
  try {
    const r = await fetch(sbURL()+'/rest/v1/'+path, { headers: sbHeaders() });
    if(r.status===404 || r.status===400){ const t=await r.text(); if(/relation|does not exist|could not find the table|schema cache/i.test(t)) return {ok:false, missing:true, rows:[], status:r.status}; return {ok:false, missing:false, rows:[], status:r.status}; }
    if(!r.ok) return {ok:false, missing:false, rows:[], status:r.status};
    return {ok:true, rows: await r.json(), status:200};
  } catch(e){ return {ok:false, missing:false, rows:[], status:0, err:e}; }
}
async function sbWrite(method, path, body, prefer){
  try {
    const r = await fetch(sbURL()+'/rest/v1/'+path, { method, headers: sbHeaders({'Content-Type':'application/json', Prefer: prefer||'return=representation'}), body: body?JSON.stringify(body):undefined });
    let data=null; try{ data=await r.json(); }catch(e){}
    return { ok:r.ok, status:r.status, data };
  } catch(e){ return { ok:false, status:0, err:e }; }
}
async function logAudit(action, target, detail){ try{ await sbWrite('POST','audit_events',{ actor_email:(typeof HQ_USER!=='undefined'&&HQ_USER)?HQ_USER.email:null, action, target:target||null, detail:detail||null }); }catch(e){} }

async function saveDeal(editId){
  const g=id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
  const title=g('f_title'), price=parseFloat(g('f_price')), url=g('f_url');
  if(!title){ toast('Please enter a deal name'); return; }
  if(isNaN(price)){ toast('Please enter a current price'); return; }
  if(!url){ toast('Please enter the retailer link'); return; }
  const op=parseFloat(g('f_oprice'));
  const rec = {
    title, description:g('f_desc')||null, store:g('f_store')||null, category:g('f_category')||null,
    price, original_price:isNaN(op)?null:op,
    discount:(op&&price&&op>price)?Math.round((1-price/op)*100):null,
    image:g('f_image')||null, affiliate_url:url,
    price_checked:g('f_checked')||null, expiry:g('f_expiry')||null,
    featured:document.getElementById('f_featured').checked,
    deal_of_day:document.getElementById('f_dotd').checked,
    is_black_friday:document.getElementById('f_bf').checked,
    source:'hq-manual'
  };
  const sess = EBF.getSession(), url_=(window.EBF_SUPABASE||{}).url, key=(window.EBF_SUPABASE||{}).publishableKey;
  if(!sess||!sess.access_token){ toast('Please sign in again'); return; }
  try {
    let endpoint = url_+'/rest/v1/deals', method='POST';
    if(editId){ endpoint += '?ext_id=eq.'+encodeURIComponent(editId); method='PATCH'; }
    const r = await fetch(endpoint,{ method, headers:{ apikey:key, Authorization:'Bearer '+sess.access_token, 'Content-Type':'application/json', Prefer:'return=representation' }, body:JSON.stringify(rec) });
    if(!r.ok){ const t=await r.text(); toast('Save failed: '+r.status); console.warn('deal save',r.status,t); return; }
    toast(editId?'Deal updated':'Deal saved'); location.hash='#/deals';
  } catch(e){ toast('Save error — check your connection'); console.warn(e); }
}

  const el=document.getElementById('batchHistory'); const res=await sbSelect('import_batches?select=*&order=created_at.desc&limit=10');
  if(res.missing){ el.outerHTML=`<div class="inline-note" id="batchHistory">${icon('<circle cx="12" cy="12" r="10"/>')}Saved-import history turns on once the imports tables exist (run the schema). Importing still works now — approved rows go straight to your catalog.</div>`; return; }
  if(!res.ok){ el.textContent='Could not load history.'; return; }
  if(!res.rows.length){ el.textContent='No imports yet.'; return; }
  el.outerHTML=`<table class="data-table" id="batchHistory"><thead><tr><th>File</th><th>Rows</th><th>Approved</th><th>Status</th><th>When</th></tr></thead><tbody>${res.rows.map(b=>`<tr><td>${esc(b.filename||'—')}</td><td>${b.total_rows}</td><td>${b.approved}</td><td><span class="status ${b.status==='approved'?'live':'draft'}">${esc(b.status)}</span></td><td class="t-sub">${fdate(b.created_at)}</td></tr>`).join('')}</tbody></table>`;

function parseCsv(input){
  const file=input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ IMPORT_ROWS=csvToRows(rd.result); reviewImport(); };
  rd.readAsText(file);
}
function csvToRows(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length) return [];
  const split=l=>{ const out=[]; let cur='',q=false; for(let i=0;i<l.length;i++){ const c=l[i]; if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===','&&!q){ out.push(cur); cur=''; } else cur+=c; } out.push(cur); return out; };
  const head=split(lines[0]).map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(l=>{ const c=split(l); const o={}; head.forEach((h,i)=>o[h]=(c[i]||'').trim()); return o; });
}
function reviewImport(){
  const box=document.getElementById('importReview');
  if(!IMPORT_ROWS.length){ box.innerHTML=`<div class="inline-note">${icon('<circle cx="12" cy="12" r="10"/>')}No rows found in that file.</div>`; return; }
  const existing=new Set((HQ_DEALS||[]).map(d=>(d.title||'').toLowerCase()));
  const rows=IMPORT_ROWS.map((r,i)=>{
    const issues=[];
    if(!r.title) issues.push('missing title');
    if(!r.price||isNaN(parseFloat(r.price))) issues.push('bad price');
    if(!r.affiliate_url) issues.push('missing link');
    if(r.title&&existing.has(r.title.toLowerCase())) issues.push('duplicate');
    const op=parseFloat(r.original_price),p=parseFloat(r.price);
    if(op&&p&&op<=p) issues.push('original ≤ price');
    if(op&&p&&(1-p/op)>0.95) issues.push('suspicious discount');
    return {r,issues,i};
  });
  const okCount=rows.filter(x=>!x.issues.length).length;
  box.innerHTML=`<div class="panel"><h3>${icon('<path d="M9 11l3 3L22 4"/>')}Review ${rows.length} rows — ${okCount} clean, ${rows.length-okCount} with issues</h3>
    <div class="toolbar"><button class="btn-gold" onclick="approveImport()">${icon('<path d="M9 11l3 3L22 4"/>')}Approve clean rows → add to catalog (${okCount})</button>
      <span class="hint">Only rows with no issues are added. Writes use your owner sign-in and are untested until it's live.</span></div>
    <table class="data-table"><thead><tr><th>Title</th><th>Price</th><th>Store</th><th>Issues</th></tr></thead><tbody>${rows.map(x=>`<tr>
      <td class="t-title">${esc(x.r.title||'—')}</td><td>${money(parseFloat(x.r.price))}</td><td>${esc(x.r.store||'—')}</td>
      <td>${x.issues.length?`<span class="status paused">${x.issues.map(esc).join(', ')}</span>`:'<span class="status live">clean</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}
async function approveImport(){
  const existing=new Set((HQ_DEALS||[]).map(d=>(d.title||'').toLowerCase()));
  const good=IMPORT_ROWS.filter(r=>r.title&&!isNaN(parseFloat(r.price))&&r.affiliate_url&&!existing.has(r.title.toLowerCase()));
  if(!good.length){ toast('No clean rows to add'); return; }
  const payload=good.map(r=>{ const op=parseFloat(r.original_price),p=parseFloat(r.price); return { title:r.title, price:p, original_price:isNaN(op)?null:op, discount:(op&&p&&op>p)?Math.round((1-p/op)*100):null, image:r.image||null, store:r.store||null, category:(r.category||'').toLowerCase()||null, affiliate_url:r.affiliate_url, expiry:r.expiry||null, source:'import-csv' }; });
  const r=await sbWrite('POST','deals',payload);
  if(r.ok){ toast(good.length+' deals added'); logAudit('import.approve',null,{count:good.length}); IMPORT_ROWS=[]; document.getElementById('importReview').innerHTML=`<div class="inline-note">${icon('<path d="M9 11l3 3L22 4"/>')}Added ${good.length} deals to your catalog. Check them in the Deal Library.</div>`; }
  else toast('Import write failed ('+r.status+')');
}

/* ========== Router ========== */
let HQ_USER = null;
function router(){
  let hash = (location.hash||'#/').replace(/^#\//,'');
  let [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs||'');
  // normalize deals/new?id= as the add/edit route
  const navKey = path.startsWith('deals/new')?'deals/new':path;
  renderNav(navKey.split('?')[0]);
  document.getElementById('sidebar').classList.remove('open');
  const view = document.getElementById('view');
  window.scrollTo(0,0);
  if(path===''||path==='dashboard') return screenDashboard(view);
  if(path==='deals') return screenDeals(view);
  if(path==='deals/new') return screenAddEditDeal(view, params);
  if(path==='categories') return screenCategories(view);
  if(path==='imports') return screenImports(view);
  if(path==='appearance') return screenAppearance(view);
  if(path==='promotions') return screenPromotions(view);
  if(path==='email') return screenEmail(view);
  if(path==='audience') return screenAudience(view);
  if(path==='billing') return screenBilling(view);
  if(path==='support') return screenSupport(view);
  if(path==='team') return screenTeam(view);
  if(path==='integrations') return screenIntegrations(view);
  if(path==='health') return screenHealth(view);
  if(path==='emergency') return screenEmergency(view);
  if(path==='ai') return screenAI(view);
  return screenPlaceholder(view, path);
}

function showGate(title,msg,actionHtml){
  document.getElementById('gateTitle').textContent=title;
  document.getElementById('gateMsg').textContent=msg;

function enterHQ(user){
  HQ_USER=user;
  document.getElementById('gate').style.display='none';
  document.getElementById('hq').classList.add('show');
  document.getElementById('tbUserName').textContent = user.name ? user.name.split(' ')[0] : 'Owner';
  if(user.avatar){ document.getElementById('tbUser').innerHTML = `<img src="${esc(user.avatar)}" alt=""><span>${esc(user.name.split(' ')[0])}</span>`; }
  window.addEventListener('hashchange', router);
  router();
}
async function gate(){
  // wait for shared.js (EBF) to be ready
  if(typeof EBF==='undefined'){ return setTimeout(gate,80); }
  // let any fresh sign-in redirect settle, then load the user
  await EBF.handleAuthRedirect();
  let user = await EBF.loadSbUser();
  if(!user){
    showGate('Owner sign-in required','Sign in with your owner Google account to open the HQ.',
      `<button class="gate-btn" onclick="EBF.signIn()">${icon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>')} Sign in with Google</button>`);
    return;
  }
  if(!user.is_admin){
    // Say exactly what went wrong. "Not the owner" and "couldn't check" are
    // different problems and used to look identical from this screen.
    const couldNotCheck = user.profileState && user.profileState !== 'ok';
    const why = couldNotCheck
      ? `You're signed in as <b>${esc(user.email||'unknown')}</b>, but the site could not read your account record to confirm ownership (${esc(user.profileState)}). That is a database permission problem, not a wrong account.`
      : `You're signed in as <b>${esc(user.email||'a member')}</b>. That account is not the site owner. The owner account is the Google account the site was set up with — sign out and back in with that one.`;
    showGate('This area is owner-only', why,
      `<button class="gate-btn" onclick="EBF.signOut().then(()=>location.reload())">${icon('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>')} Sign out and use a different account</button>
       <a class="btn-ghost" href="index.html" style="margin-left:10px">← Back to the site</a>`);
    return;
  }
  enterHQ(user);
}
document.addEventListener('DOMContentLoaded', gate);
</script>
